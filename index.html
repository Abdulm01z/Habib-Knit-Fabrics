<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RFQ · Habib Knit Fabrics (Pvt) Limited</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
    }

    /* ----- LOADING SCREEN (full screen, 3s, tube style) ----- */
    #loadingScreen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #0b1420;
      background: radial-gradient(circle at 50% 40%, #162233 0%, #0a111c 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.7s ease, transform 0.6s ease;
    }
    #loadingScreen.hide {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }

    .loader-logo-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .loader-logo {
      width: 200px;
      max-width: 60vw;
      height: auto;
      object-fit: contain;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(6px);
      padding: 16px 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.04);
      display: block;
    }

    .tube-wrapper {
      margin-top: 48px;
      width: 320px;
      max-width: 80vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .loader-sub {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      font-weight: 300;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.25);
      margin-bottom: 6px;
    }

    .tube-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 40px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .tube-fill {
      height: 100%;
      width: 0%;
      border-radius: 40px;
      background: linear-gradient(90deg, #005792, #4fc3ff, #005792);
      background-size: 200% 100%;
      animation: tubeFlow 1.8s ease-in-out infinite;
      box-shadow: 0 0 20px rgba(79, 195, 255, 0.25);
      transition: width 0.2s linear;
    }

    @keyframes tubeFlow {
      0% { background-position: 0% 0; }
      100% { background-position: 200% 0; }
    }

    .tube-glow {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #4fc3ff;
      box-shadow: 0 0 24px #4fc3ff, 0 0 60px rgba(79, 195, 255, 0.2);
      position: absolute;
      right: -2px;
      top: 50%;
      transform: translate(50%, -50%) scale(0);
      transition: transform 0.3s ease;
    }
    .tube-glow.active {
      transform: translate(50%, -50%) scale(1);
    }

    .tube-label {
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 18px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.04);
      padding: 6px 20px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(4px);
      min-width: 80px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .tube-label span {
      color: #4fc3ff;
      font-weight: 600;
    }

    .tube-wrapper {
      animation: tubePulse 2.8s ease-in-out infinite alternate;
    }
    @keyframes tubePulse {
      0% { opacity: 0.8; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.01); }
    }

    @media (max-width: 600px) {
      .loader-logo { width: 140px; padding: 12px 16px; }
      .tube-wrapper { width: 280px; margin-top: 36px; }
      .tube-label { font-size: 15px; padding: 4px 16px; min-width: 64px; }
    }
    @media (max-width: 400px) {
      .loader-logo { width: 110px; padding: 10px 12px; }
      .tube-wrapper { width: 220px; margin-top: 28px; }
      .tube-label { font-size: 13px; padding: 4px 12px; min-width: 56px; }
      .loader-sub { font-size: 11px; letter-spacing: 2px; }
    }

    /* ----- MAIN APP (hidden until loading ends) ----- */
    #appRoot {
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #appRoot.visible {
      opacity: 1;
    }

    /* ----- ORIGINAL RFQ STYLES (unchanged) ----- */
    body {
      background: #eef2f7;
      padding: 20px;
      color: #1a2b3c;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 794px;
      min-height: 1123px;
      background: #ffffff;
      padding: 40px 44px 36px;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 55%;
      max-width: 400px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.1;
      text-align: center;
    }
    .watermark img {
      width: 100%;
      height: auto;
      filter: grayscale(100%) brightness(1.05);
      image-rendering: auto;
    }

    .content-area {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .header-table {
      width: 100%;
      border-collapse: collapse;
      border-bottom: 2px solid #005792;
      padding-bottom: 14px;
      margin-bottom: 22px;
      background: transparent;
    }
    .header-table td {
      vertical-align: middle;
      border: none;
      padding: 0 6px 0 0;
      background: transparent;
    }
    .header-left { width: 14%; text-align: left; }
    .header-center { width: 56%; text-align: center; }
    .header-right { width: 30%; text-align: right; }

    .logo-img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      border-radius: 12px;
      background: rgba(248, 250, 252, 0.7);
      padding: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }

    .company-title {
      color: #005792;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.2px;
      margin-bottom: 2px;
    }
    .company-subtitle {
      color: #2c3e50;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      background: rgba(238, 244, 250, 0.8);
      display: inline-block;
      padding: 2px 18px;
      border-radius: 40px;
    }

    .meta-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #1a2b3c;
      margin-bottom: 6px;
      white-space: nowrap;
    }
    .meta-input {
      border: 1px solid #dce4ec;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 13px;
      font-weight: 600;
      color: #0b1e2e;
      width: 140px;
      text-align: right;
      background: rgba(250, 252, 255, 0.7);
      transition: 0.15s;
    }
    .meta-input:focus {
      border-color: #005792;
      outline: none;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 0 3px rgba(0,87,146,0.08);
    }

    .table-wrap {
      margin: 18px 0 10px;
      border-radius: 14px;
      overflow: hidden;
      flex-shrink: 0;
      background: transparent;
      position: relative;
      z-index: 1;
    }

    table.data-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      background: transparent;
    }

    table.data-table th {
      background: #005792 !important;
      color: #ffffff !important;
      padding: 12px 8px;
      font-weight: 600;
      font-size: 12px;
      border: none;
      letter-spacing: 0.3px;
    }
    table.data-table th:first-child { border-radius: 12px 0 0 0; }
    table.data-table th:last-child { border-radius: 0 12px 0 0; }

    table.data-table td {
      border: 1px solid rgba(200, 212, 224, 0.5);
      padding: 4px 2px;
      vertical-align: middle;
      background: rgba(255, 255, 255, 0.15) !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }

    table.data-table tr {
      background: transparent !important;
    }
    table.data-table tbody tr {
      background: transparent !important;
    }
    table.data-table tbody tr:nth-child(even) td {
      background: rgba(248, 250, 252, 0.12) !important;
    }
    table.data-table tbody tr:nth-child(odd) td {
      background: rgba(255, 255, 255, 0.08) !important;
    }

    .text-center { text-align: center !important; }
    .text-left { text-align: left !important; }

    table.data-table input {
      border: none;
      background: rgba(255, 255, 255, 0.35) !important;
      width: 100%;
      padding: 8px 6px;
      font-size: 13px;
      color: #142433;
      border-radius: 6px;
      transition: 0.1s;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
    table.data-table input:focus {
      background: rgba(255, 255, 255, 0.85) !important;
      outline: 2px solid #005792;
      outline-offset: -1px;
      box-shadow: 0 0 0 4px rgba(0,87,146,0.06);
    }
    table.data-table input::placeholder {
      color: #8a9fb0;
      font-weight: 400;
    }

    .qty-input, .unit-input, .date-input {
      text-align: center;
    }
    .desc-input { text-align: left; }

    .btn-group {
      margin: 22px 0 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }

    button {
      padding: 9px 18px;
      border: none;
      border-radius: 40px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      background: #f1f6fa;
      color: #1f3a57;
      letter-spacing: 0.2px;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
    }
    button:active { transform: scale(0.97); }

    .btn-add { background: #005792; color: #fff; }
    .btn-add:hover { background: #003f66; box-shadow: 0 6px 14px rgba(0,87,146,0.20); }

    .btn-clear { background: #edf2f7; color: #2d3f57; }
    .btn-clear:hover { background: #e2e8f0; }

    .btn-export { background: #1e6f5c; color: #fff; }
    .btn-export:hover { background: #155a4a; box-shadow: 0 6px 14px rgba(30,111,92,0.18); }

    .btn-print { background: #2d3748; color: #fff; margin-left: auto; }
    .btn-print:hover { background: #1a202c; box-shadow: 0 6px 14px rgba(45,55,72,0.18); }

    .btn-remove {
      background: rgba(229, 62, 62, 0.8);
      color: #fff;
      width: 30px;
      height: 30px;
      padding: 0;
      font-size: 14px;
      border-radius: 40px;
      justify-content: center;
      margin: 0 auto;
      display: flex;
      align-items: center;
      transition: 0.15s;
      line-height: 1;
    }
    .btn-remove:hover {
      background: #c53030;
      transform: scale(1.05);
      box-shadow: 0 4px 8px rgba(229,62,62,0.20);
    }

    .footer-section {
      margin-top: auto;
      padding-top: 28px;
      border-top: 1px dashed rgba(203, 218, 232, 0.6);
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
      background: transparent;
      position: relative;
      z-index: 2;
    }

    .sig-block { width: 45%; }
    .sig-title {
      font-size: 11px;
      font-weight: 700;
      color: #005792;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }
    .sig-line {
      border-top: 2px solid #1f3a57;
      width: 100%;
      max-width: 200px;
      padding-top: 6px;
      margin-top: 32px;
      font-size: 12px;
      font-weight: 600;
      color: #3d5775;
      white-space: nowrap;
    }
    .sig-block-right { text-align: right; }
    .sig-block-right .sig-line { margin-left: auto; }

    @media (max-width: 640px) {
      body { padding: 12px; }
      .container { padding: 20px; min-height: auto; }
      .header-left, .header-center, .header-right { display: block; width: 100%; text-align: center; }
      .header-table td { display: block; text-align: center; padding: 4px 0; }
      .meta-row { justify-content: center; }
      .btn-print { margin-left: 0; }
      .footer-section { flex-direction: column; gap: 20px; }
      .sig-block, .sig-block-right { width: 100%; text-align: center !important; }
      .sig-block-right .sig-line { margin-left: auto; margin-right: auto; }
      .sig-line { max-width: 100%; }
    }

    @media print {
      @page { size: A4 portrait; margin: 10mm 12mm 10mm 12mm; }
      body { background: #ffffff !important; padding: 0 !important; margin: 0 !important; display: block; }
      .container {
        box-shadow: none !important;
        padding: 40px 44px 36px !important;
        max-width: 100% !important;
        min-height: auto !important;
        border-radius: 0 !important;
        width: 100% !important;
        background: #ffffff !important;
      }
      .btn-group, th.action-col, td.action-col { display: none !important; }
      .watermark { opacity: 0.1 !important; display: block !important; }
      .header-table, .footer-section { display: flex !important; width: 100% !important; }
      .header-table { display: table !important; }
      .header-table td { display: table-cell !important; background: transparent !important; }
      .meta-input, table.data-table input {
        border: none !important;
        background: rgba(255, 255, 255, 0.2) !important;
        padding: 2px 0 !important;
        box-shadow: none !important;
        font-weight: 600;
        color: #142433 !important;
      }
      input[type="date"]::-webkit-calendar-picker-indicator { display: none !important; }
      .data-table th {
        background: #005792 !important;
        color: white !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact;
      }
      .data-table td {
        border-color: rgba(184, 201, 221, 0.4) !important;
        background: rgba(255, 255, 255, 0.12) !important;
      }
      .data-table tbody tr:nth-child(even) td {
        background: rgba(248, 250, 252, 0.10) !important;
      }
      .data-table tbody tr:nth-child(odd) td {
        background: rgba(255, 255, 255, 0.06) !important;
      }
      .company-subtitle {
        background: rgba(238, 244, 250, 0.8) !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .sig-line { border-top-color: #1f3a57 !important; }
      .footer-section { border-top-color: rgba(184, 201, 221, 0.4) !important; }
      .data-table tr { page-break-inside: avoid; }
      .table-wrap { box-shadow: none !important; border-radius: 0 !important; background: transparent !important; }
      .container { box-shadow: none !important; }
    }
  </style>
</head>
<body>

  <!-- ====== LOADING SCREEN (full screen, 3s, tube style) ====== -->
  <div id="loadingScreen">
    <div class="loader-logo-wrapper">
      <img 
        src="https://i.postimg.cc/dVNwKmqq/Whats-App-Image-2026-07-06-at-10-58-59-PM.jpg" 
        alt="Habib Knit Fabrics (Pvt) Limited" 
        class="loader-logo"
      />
    </div>
    <div class="tube-wrapper">
      <div class="loader-sub">Loading</div>
      <div class="tube-track">
        <div class="tube-fill" id="tubeFill"></div>
        <div class="tube-glow" id="tubeGlow"></div>
      </div>
      <div class="tube-label" id="tubeLabel">0<span>%</span></div>
    </div>
  </div>

  <!-- ====== MAIN APP ====== -->
  <div id="appRoot">
    <div class="container">
      <div class="watermark">
        <img src="https://i.postimg.cc/dVNwKmqq/Whats-App-Image-2026-07-06-at-10-58-59-PM.jpg" alt="watermark" />
      </div>

      <div class="content-area">
        <table class="header-table">
          <tr>
            <td class="header-left">
              <img src="https://i.postimg.cc/dVNwKmqq/Whats-App-Image-2026-07-06-at-10-58-59-PM.jpg" alt="Logo" class="logo-img" />
            </td>
            <td class="header-center">
              <div class="company-title">Habib Knit Fabrics (Pvt) Limited</div>
              <span class="company-subtitle">Request for Quotation (RFQ)</span>
              <span class="company-subtitle">CNC Department </span>
            </td>
            <td class="header-right">
              <div class="meta-row">
                <strong>RFQ No:</strong>
                <input type="text" id="rfqInput" class="meta-input" value="RFQ-2026-1280">
              </div>
              <div class="meta-row">
                <strong>Date:</strong>
                <input type="date" id="dateInput" class="meta-input">
              </div>
            </td>
          </tr>
        </table>

        <div class="table-wrap">
          <table class="data-table" id="itemTable">
            <thead>
              <tr>
                <th style="width: 38px;" class="text-center">#</th>
                <th class="text-left">Description</th>
                <th style="width: 78px;" class="text-center">Qty</th>
                <th style="width: 88px;" class="text-center">Unit</th>
                <th style="width: 124px;" class="text-center">Required Date</th>
                <th style="width: 46px;" class="text-center action-col"></th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>

        <div class="btn-group">
          <button type="button" class="btn-add" id="btnAddRow">➕ Add Item</button>
          <button type="button" class="btn-clear" id="btnClearRows">🗑️ Clear All</button>
          <button type="button" class="btn-export" id="btnExport">📤 Export JSON</button>
          <button type="button" class="btn-print" id="btnPrint">🖨️ Print RFQ</button>
        </div>

        <div class="footer-section">
          <div class="sig-block">
            <div class="sig-title">Prepared By</div>
            <div class="sig-line">Authorized Person</div>
          </div>
          <div class="sig-block sig-block-right">
            <div class="sig-title">Approved By</div>
            <div class="sig-line">Authorized Signature</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      // ----- LOADING SCREEN LOGIC (3s tube animation) -----
      const loadingScreen = document.getElementById('loadingScreen');
      const appRoot = document.getElementById('appRoot');
      const tubeFill = document.getElementById('tubeFill');
      const tubeLabel = document.getElementById('tubeLabel');
      const tubeGlow = document.getElementById('tubeGlow');

      const DURATION = 3000;
      let startTime = null;
      let animationFrame = null;

      function updateTube(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const progress = Math.min(elapsed / DURATION, 1);
        const percent = Math.round(progress * 100);
        tubeFill.style.width = percent + '%';
        tubeLabel.innerHTML = percent + '<span>%</span>';

        if (percent >= 98) {
          tubeGlow.classList.add('active');
        } else {
          tubeGlow.classList.remove('active');
        }

        if (progress < 1) {
          animationFrame = requestAnimationFrame(updateTube);
        } else {
          tubeGlow.classList.add('active');
          setTimeout(() => {
            loadingScreen.classList.add('hide');
            appRoot.classList.add('visible');
            setTimeout(() => {
              loadingScreen.style.display = 'none';
            }, 700);
          }, 200);
        }
      }

      animationFrame = requestAnimationFrame(updateTube);

      // fallback: force complete after 3.4s
      setTimeout(() => {
        if (loadingScreen && !loadingScreen.classList.contains('hide')) {
          tubeFill.style.width = '100%';
          tubeLabel.innerHTML = '100<span>%</span>';
          tubeGlow.classList.add('active');
          setTimeout(() => {
            loadingScreen.classList.add('hide');
            appRoot.classList.add('visible');
            setTimeout(() => {
              loadingScreen.style.display = 'none';
            }, 700);
          }, 200);
          if (animationFrame) cancelAnimationFrame(animationFrame);
        }
      }, DURATION + 400);

      // ----- ORIGINAL RFQ LOGIC (unchanged) -----
      const tbody = document.getElementById('tableBody');
      const dateInput = document.getElementById('dateInput');
      const todayStr = new Date().toISOString().split('T')[0];
      dateInput.value = todayStr;

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/"/g, '&quot;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function generateRowHTML(index, data = {}) {
        const desc = data.desc || '';
        const qty = data.qty !== undefined ? data.qty : '';
        const unit = data.unit || '';
        const date = data.date || todayStr;
        return `
          <tr>
            <td class="row-index text-center" style="font-weight:600; color:#1f3a57;">${index}</td>
            <td><input type="text" class="desc-input" value="${escapeHtml(desc)}" placeholder="Item description"></td>
            <td><input type="number" class="qty-input" min="0" step="1" value="${escapeHtml(qty)}" placeholder="0"></td>
            <td><input type="text" class="unit-input" value="${escapeHtml(unit)}" placeholder="kg, m, pcs"></td>
            <td><input type="date" class="date-input" value="${escapeHtml(date)}"></td>
            <td class="text-center action-col">
              <button type="button" class="btn-remove action-remove" aria-label="Remove row">✕</button>
            </td>
          </tr>
        `;
      }

      function updateRowNumbers() {
        const rows = tbody.querySelectorAll('tr');
        rows.forEach((row, idx) => {
          const indexCell = row.querySelector('.row-index');
          if (indexCell) indexCell.textContent = idx + 1;
        });
      }

      function addRow(data = {}) {
        const newIndex = tbody.children.length + 1;
        tbody.insertAdjacentHTML('beforeend', generateRowHTML(newIndex, data));
        updateRowNumbers();
      }

      function removeRow(btn) {
        if (tbody.children.length <= 1) {
          const row = btn.closest('tr');
          if (row) {
            const inputs = row.querySelectorAll('input');
            inputs.forEach(inp => {
              if (inp.type === 'number') inp.value = '';
              else if (inp.type === 'date') inp.value = todayStr;
              else inp.value = '';
            });
          }
          return;
        }
        btn.closest('tr').remove();
        updateRowNumbers();
      }

      function clearAllRows() {
        tbody.innerHTML = '';
        addRow({});
      }

      function exportJSON() {
        const rows = tbody.querySelectorAll('tr');
        const data = [];
        rows.forEach(row => {
          const inputs = row.querySelectorAll('input');
          if (inputs.length >= 4) {
            data.push({
              description: inputs[0].value.trim(),
              quantity: inputs[1].value.trim() || '0',
              unit: inputs[2].value.trim(),
              requiredDate: inputs[3].value || todayStr
            });
          }
        });
        const jsonString = JSON.stringify(data, null, 2);
        const blob = new Blob([jsonString], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `RFQ_${document.getElementById('rfqInput').value || 'export'}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      document.getElementById('btnAddRow').addEventListener('click', () => addRow({}));
      document.getElementById('btnClearRows').addEventListener('click', clearAllRows);
      document.getElementById('btnPrint').addEventListener('click', () => window.print());
      document.getElementById('btnExport').addEventListener('click', exportJSON);

      tbody.addEventListener('click', function(e) {
        const target = e.target.closest('.action-remove');
        if (target) {
          e.preventDefault();
          removeRow(target);
        }
      });

      addRow({});

    })();
  </script>
</body>
</html>
